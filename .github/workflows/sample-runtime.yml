name: Sample runtime

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sample-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Runtime scope
    uses: ./.github/workflows/changes.yml

  runtime:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true') }}
    name: Wholesale runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install Aspire CLI matching the AppHost SDK
        env:
          DOTNET_NOLOGO: "true"
        run: |
          aspire_version="$(dotnet msbuild samples/Wholesale/AppHost/Wholesale.AppHost.csproj -getProperty:AspireHostingSDKVersion -nologo)"
          dotnet tool install --global Aspire.Cli --version "$aspire_version"
      - name: Install Linux certificate trust tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools
      - name: Trust native development HTTPS certificate
        run: |
          # Trust checks use this environment in the current step as well as later steps.
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:${SSL_CERT_DIR:-/etc/ssl/certs}"
          dotnet dev-certs https --trust
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"
      - name: Verify development HTTPS certificate trust
        run: dotnet dev-certs https --check --trust
      - name: Restore runtime consumer and its dependencies
        run: dotnet restore samples/Wholesale/RuntimeComposition.Tests/RuntimeComposition.Tests.csproj
      - name: Build runtime consumer and its dependencies
        run: dotnet build samples/Wholesale/RuntimeComposition.Tests/RuntimeComposition.Tests.csproj --no-restore
      - name: Install matching Chromium and browser system dependencies
        run: pwsh samples/Wholesale/RuntimeComposition.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test runtime setup, database outage and real OIDC browser journeys
        run: >-
          dotnet test
          --project samples/Wholesale/RuntimeComposition.Tests/RuntimeComposition.Tests.csproj
          --no-build
          --no-restore
          --no-progress
          --no-ansi
          --output Normal
          --show-stdout Failed
          --show-stderr Failed
