name: Sample runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'samples/Wholesale/**'
      - '.github/workflows/sample-runtime.yml'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'ModulithFoundry.slnx'
  push:
    branches: [main]
    paths:
      - 'samples/Wholesale/**'
      - '.github/workflows/sample-runtime.yml'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'ModulithFoundry.slnx'

permissions:
  contents: read

concurrency:
  group: sample-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Active Aspire runtime composition lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned Aspire CLI bundle
        run: dotnet tool install --global Aspire.Cli --version 13.5.4
      - name: Install Linux certificate trust tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools
      - name: Trust native development HTTPS certificate
        run: |
          # Trust checks use this environment in the current step as well as later steps.
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:${SSL_CERT_DIR:-/etc/ssl/certs}"
          dotnet dev-certs https --trust
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"
      - name: Verify development HTTPS certificate trust
        run: dotnet dev-certs https --check --trust
      - name: Restore active projects
        run: dotnet restore ModulithFoundry.slnx
      - name: Build active projects
        run: dotnet build ModulithFoundry.slnx --no-restore
      - name: Install matching Chromium and browser system dependencies
        run: pwsh samples/Wholesale/RuntimeComposition.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test runtime setup, database outage and real OIDC browser journeys
        run: >-
          dotnet test
          --project samples/Wholesale/RuntimeComposition.Tests/RuntimeComposition.Tests.csproj
          --no-build
          --no-restore
