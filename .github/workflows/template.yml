name: Template creation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Template scope
    uses: ./.github/workflows/changes.yml

  state-stored:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.template == 'true') }}
    name: Template integrity and adoption
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: t1-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CATALOG_TEST_ADMIN_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=t1-local-only;Pooling=false
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install template tooling
        run: npm ci --prefix tools/template --ignore-scripts
      - name: Check TypeScript and formatting
        run: npm --prefix tools/template run check
      - name: Prove creation and external consumer adoption
        run: npm --prefix tools/template run verify
