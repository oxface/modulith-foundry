name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libraries:
    name: Rootbolt.${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failing family must not cancel the other families' proofs.
      fail-fast: false
      matrix:
        include:
          - family: ActorIdentity
            commands: |
              dotnet test --project src/Rootbolt.ActorIdentity/tests/ActorIdentityTests/ActorIdentityTests.csproj
              dotnet test --project src/Rootbolt.ActorIdentity/tests/ActorIdentityAspNetCoreTests/ActorIdentityAspNetCoreTests.csproj
          - family: Tenancy
            commands: |
              dotnet test --project src/Rootbolt.Tenancy/tests/TenantTests/TenantTests.csproj
              dotnet test --project src/Rootbolt.Tenancy/tests/TenancyAspNetCoreTests/TenancyAspNetCoreTests.csproj
          - family: Persistence
            commands: |
              dotnet test --project src/Rootbolt.Persistence/tests/EntityFrameworkCoreTests/EntityFrameworkCoreTests.csproj
              dotnet test --project src/Rootbolt.Persistence/tests/PersistenceTests/PersistenceTests.csproj
          - family: Events
            commands: |
              dotnet test --project src/Rootbolt.Events/tests/EventSerializationTests/EventSerializationTests.csproj
              dotnet test --project src/Rootbolt.Events/tests/EventHistoryTests/EventHistoryTests.csproj
              dotnet test --project samples/Wholesale/EventCodecDemo.Tests/EventCodecDemo.Tests.csproj
              dotnet run --project samples/Wholesale/EventCodecDemo/EventCodecDemo.csproj --no-build --no-restore
          - family: EventSourcing
            commands: |
              dotnet test --project src/Rootbolt.EventSourcing/tests/EventSourcingTests/EventSourcingTests.csproj
              dotnet test --project src/Rootbolt.EventSourcing/tests/EventSourcingPostgresTests/EventSourcingPostgresTests.csproj
              dotnet test --project samples/EventStorageDemo.Tests/EventStorageDemo.Tests.csproj
              dotnet test --project samples/Wholesale/EventPersistenceDemo.Tests/EventPersistenceDemo.Tests.csproj --filter-not-class '*DispatchTests'
          - family: Messaging
            commands: |
              dotnet test --project src/Rootbolt.Messaging/tests/MessagingTests/MessagingTests.csproj
              dotnet test --project src/Rootbolt.Messaging/tests/OutboxPostgresTests/OutboxPostgresTests.csproj
              dotnet test --project src/Rootbolt.Messaging/tests/InboxPostgresTests/InboxPostgresTests.csproj
              dotnet test --project samples/OutboxDemo.Tests/OutboxDemo.Tests.csproj
              dotnet test --project samples/InboxDemo.Tests/InboxDemo.Tests.csproj
              dotnet test --project samples/Wholesale/EventPersistenceDemo.Tests/EventPersistenceDemo.Tests.csproj --filter-class '*DispatchTests'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test family and independent consumers
        # Each test restores/builds its project and dependencies on this runner.
        run: ${{ matrix.commands }}

  wholesale:
    name: Wholesale consumer composition
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test context composition
        run: dotnet test --project samples/Wholesale/ContextDemo.Tests/ContextDemo.Tests.csproj
      - name: Run context sample
        run: dotnet run --project samples/Wholesale/ContextDemo/ContextDemo.csproj --no-build --no-restore
      - name: Test module migrations and persistence ownership
        run: dotnet test --project samples/Wholesale/PersistenceDemo.Tests/PersistenceDemo.Tests.csproj
      - name: Test persisted admission, isolated business operations and native telemetry through HTTP
        run: dotnet test --project samples/Wholesale/HttpIdentityDemo.Tests/HttpIdentityDemo.Tests.csproj

  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore active projects
        run: dotnet restore ModulithFoundry.slnx

      - name: Verify active code style
        run: dotnet format style ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Verify active analyzers
        run: dotnet format analyzers ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Build active solution
        run: dotnet build ModulithFoundry.slnx --no-restore

      - name: Test architecture, module schemas and independent adoption
        run: dotnet test --project tests/ArchitectureTests/ArchitectureTests.csproj --no-build --no-restore

      - name: Set up Node.js for repository checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install repository tools
        working-directory: ${{ github.workspace }}
        run: npm ci --prefix tools/repository

      - name: Verify archive snapshot
        working-directory: ${{ github.workspace }}
        run: python3 tools/repository/verify-archive.py

      - name: Restore active formatter
        run: dotnet tool restore

      - name: Verify root formatting
        run: dotnet csharpier check . --include-generated

      - name: Check pull-request commits
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: >-
          npm exec --prefix tools/repository -- commitlint
          --config tools/repository/commitlint.config.mjs
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Check pushed commit
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: >-
          npm exec --prefix tools/repository -- commitlint
          --config tools/repository/commitlint.config.mjs
          --last
          --verbose
