name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: archive/proof-sample

jobs:
  context:
    name: Active context lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore active projects
        run: dotnet restore ModulithFoundry.slnx

      - name: Verify active code style
        run: dotnet format style ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Verify active analyzers
        run: dotnet format analyzers ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Build active projects
        run: dotnet build ModulithFoundry.slnx --no-restore

      - name: Test active architecture and independent adoption
        run: dotnet test --project tests/ArchitectureTests/ArchitectureTests.csproj --no-build --no-restore

      - name: Test actor identity library
        run: >-
          dotnet test
          --project tests/ActorIdentityTests/ActorIdentityTests.csproj
          --no-build
          --no-restore

      - name: Test tenancy library
        run: >-
          dotnet test
          --project tests/TenantTests/TenantTests.csproj
          --no-build
          --no-restore

      - name: Test sample composition
        run: >-
          dotnet test
          --project samples/Wholesale/ContextDemo.Tests/ContextDemo.Tests.csproj
          --no-build
          --no-restore

      - name: Test EF models and write validation without containers
        run: >-
          dotnet test
          --project tests/EntityFrameworkCoreTests/EntityFrameworkCoreTests.csproj
          --no-build
          --no-restore

      - name: Run context sample
        run: >-
          dotnet run
          --project samples/Wholesale/ContextDemo/ContextDemo.csproj
          --no-build
          --no-restore

  persistence:
    name: Active PostgreSQL ownership lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore active projects
        run: dotnet restore ModulithFoundry.slnx
      - name: Test independent GUID ownership consumer
        run: dotnet test --project tests/PersistenceTests/PersistenceTests.csproj --no-restore
      - name: Test Inventory persistence composition
        run: dotnet test --project samples/Wholesale/PersistenceDemo.Tests/PersistenceDemo.Tests.csproj --no-restore

  fast:
    name: Archived Fast lane and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: archive/proof-sample/global.json

      - name: Set up Node.js for repository checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install repository tools
        working-directory: ${{ github.workspace }}
        run: npm ci --prefix tools/repository

      - name: Verify archive snapshot
        working-directory: ${{ github.workspace }}
        run: python3 tools/repository/verify-archive.py

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Restore archived tools
        run: dotnet tool restore

      - name: Restore active formatter
        working-directory: ${{ github.workspace }}
        run: dotnet tool restore

      - name: Verify root formatting
        working-directory: ${{ github.workspace }}
        run: dotnet csharpier check . --include-generated

      - name: Verify archived formatting
        run: dotnet csharpier check . --include-generated --ignore-path .gitignore

      - name: Verify code style
        run: dotnet format style ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Verify analyzers
        run: dotnet format analyzers ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ModulithFoundry.slnx --no-restore

      - name: Test application behavior
        run: >-
          dotnet test
          --project tests/ApplicationTests/ApplicationTests.csproj
          --no-build
          --no-restore

      - name: Test architecture
        run: >-
          dotnet test
          --project tests/ArchitectureTests/ArchitectureTests.csproj
          --no-build
          --no-restore

      - name: Check pull-request commits
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: >-
          npm exec --prefix tools/repository -- commitlint
          --config tools/repository/commitlint.config.mjs
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Check pushed commit
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: >-
          npm exec --prefix tools/repository -- commitlint
          --config tools/repository/commitlint.config.mjs
          --last
          --verbose

  postgresql:
    name: PostgreSQL lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: archive/proof-sample/global.json

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Test PostgreSQL behavior
        run: >-
          dotnet test
          --project tests/PersistenceTests/PersistenceTests.csproj
          --no-restore

  broker:
    name: RabbitMQ lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: archive/proof-sample/global.json

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Test durable messaging
        run: >-
          dotnet test
          --project tests/BrokerTests/BrokerTests.csproj
          --no-restore

  topology:
    name: Topology lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: archive/proof-sample/global.json

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Test Aspire topology
        run: >-
          dotnet test
          --project tests/TopologyTests/TopologyTests.csproj
          --no-restore
