name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: archive/proof-sample

jobs:
  context:
    name: Active context lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore active projects
        run: dotnet restore ModulithFoundry.slnx

      - name: Verify active code style
        run: dotnet format style ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Verify active analyzers
        run: dotnet format analyzers ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Build active projects
        run: dotnet build ModulithFoundry.slnx --no-restore

      - name: Test active architecture, module schemas and independent adoption
        run: dotnet test --project tests/ArchitectureTests/ArchitectureTests.csproj --no-build --no-restore

      - name: Test actor identity library
        run: >-
          dotnet test
          --project src/ModulithFoundry.ActorIdentity/tests/ActorIdentityTests/ActorIdentityTests.csproj
          --no-build
          --no-restore

      - name: Test tenancy library
        run: >-
          dotnet test
          --project src/ModulithFoundry.Tenancy/tests/TenantTests/TenantTests.csproj
          --no-build
          --no-restore

      - name: Test sample composition
        run: >-
          dotnet test
          --project samples/Wholesale/ContextDemo.Tests/ContextDemo.Tests.csproj
          --no-build
          --no-restore

      - name: Test EF models and write validation without containers
        run: >-
          dotnet test
          --project src/ModulithFoundry.Persistence/tests/EntityFrameworkCoreTests/EntityFrameworkCoreTests.csproj
          --no-build
          --no-restore

      - name: Test actor HTTP integration
        # HTTP identity proofs use native protected cookies and require no external provider.
        # The runnable HTTP sample has no test authentication shortcut.
        run: >-
          dotnet test
          --project src/ModulithFoundry.ActorIdentity/tests/ActorIdentityAspNetCoreTests/ActorIdentityAspNetCoreTests.csproj
          --no-build
          --no-restore

      - name: Test independent tenancy HTTP integration
        run: >-
          dotnet test
          --project src/ModulithFoundry.Tenancy/tests/TenancyAspNetCoreTests/TenancyAspNetCoreTests.csproj
          --no-build
          --no-restore

      - name: Run context sample
        run: >-
          dotnet run
          --project samples/Wholesale/ContextDemo/ContextDemo.csproj
          --no-build
          --no-restore

      - name: Test explicit event serialization
        run: dotnet test --project src/ModulithFoundry.Events/tests/EventSerializationTests/EventSerializationTests.csproj --no-build --no-restore

      - name: Test bounded ordered event history
        run: dotnet test --project src/ModulithFoundry.Events/tests/EventHistoryTests/EventHistoryTests.csproj --no-build --no-restore

      - name: Aggregate core tests
        run: dotnet test --project src/ModulithFoundry.EventSourcing/tests/EventSourcingTests/EventSourcingTests.csproj --no-build --no-restore

      - name: Test event codec consumer compatibility
        run: dotnet test --project samples/Wholesale/EventCodecDemo.Tests/EventCodecDemo.Tests.csproj --no-build --no-restore

      - name: Run independent event codec consumer
        run: dotnet run --project samples/Wholesale/EventCodecDemo/EventCodecDemo.csproj --no-build --no-restore

  persistence:
    name: Active PostgreSQL ownership lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore active projects
        run: dotnet restore ModulithFoundry.slnx
      - name: Test independent GUID ownership consumer
        run: dotnet test --project src/ModulithFoundry.Persistence/tests/PersistenceTests/PersistenceTests.csproj --no-restore
      - name: Test module migrations and persistence ownership
        run: dotnet test --project samples/Wholesale/PersistenceDemo.Tests/PersistenceDemo.Tests.csproj --no-restore
      - name: Test independent shared event-storage registration
        run: dotnet test --project samples/EventStorageDemo.Tests/EventStorageDemo.Tests.csproj --no-restore
      - name: Test single-stream rebuilding and provider admission
        run: dotnet test --project src/ModulithFoundry.EventSourcing/tests/EventSourcingPostgresTests/EventSourcingPostgresTests.csproj --no-restore
      - name: Test native event-history reads and append transactions
        run: dotnet test --project samples/Wholesale/EventPersistenceDemo.Tests/EventPersistenceDemo.Tests.csproj --no-restore
      - name: Test persisted admission, isolated business operations and native telemetry through HTTP
        run: dotnet test --project samples/Wholesale/HttpIdentityDemo.Tests/HttpIdentityDemo.Tests.csproj --no-restore

  runtime:
    name: Active Aspire runtime composition lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned Aspire CLI bundle
        run: dotnet tool install --global Aspire.Cli --version 13.5.4
      - name: Ensure native development HTTPS certificate
        run: dotnet dev-certs https
      - name: Restore active projects
        run: dotnet restore ModulithFoundry.slnx
      - name: Build active projects
        run: dotnet build ModulithFoundry.slnx --no-restore
      - name: Install matching Chromium and browser system dependencies
        run: pwsh samples/Wholesale/RuntimeComposition.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test runtime setup, database outage and real OIDC browser journeys
        run: >-
          dotnet test
          --project samples/Wholesale/RuntimeComposition.Tests/RuntimeComposition.Tests.csproj
          --no-build
          --no-restore

  fast:
    name: Archived Fast lane and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: archive/proof-sample/global.json

      - name: Set up Node.js for repository checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install repository tools
        working-directory: ${{ github.workspace }}
        run: npm ci --prefix tools/repository

      - name: Verify archive snapshot
        working-directory: ${{ github.workspace }}
        run: python3 tools/repository/verify-archive.py

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Restore archived tools
        run: dotnet tool restore

      - name: Restore active formatter
        working-directory: ${{ github.workspace }}
        run: dotnet tool restore

      - name: Verify root formatting
        working-directory: ${{ github.workspace }}
        run: dotnet csharpier check . --include-generated

      - name: Verify archived formatting
        run: dotnet csharpier check . --include-generated --ignore-path .gitignore

      - name: Verify code style
        run: dotnet format style ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Verify analyzers
        run: dotnet format analyzers ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ModulithFoundry.slnx --no-restore

      - name: Test application behavior
        run: >-
          dotnet test
          --project tests/ApplicationTests/ApplicationTests.csproj
          --no-build
          --no-restore

      - name: Test architecture
        run: >-
          dotnet test
          --project tests/ArchitectureTests/ArchitectureTests.csproj
          --no-build
          --no-restore

      - name: Check pull-request commits
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: >-
          npm exec --prefix tools/repository -- commitlint
          --config tools/repository/commitlint.config.mjs
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Check pushed commit
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: >-
          npm exec --prefix tools/repository -- commitlint
          --config tools/repository/commitlint.config.mjs
          --last
          --verbose

  postgresql:
    name: PostgreSQL lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: archive/proof-sample/global.json

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Test PostgreSQL behavior
        run: >-
          dotnet test
          --project tests/PersistenceTests/PersistenceTests.csproj
          --no-restore

  broker:
    name: RabbitMQ lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: archive/proof-sample/global.json

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Test durable messaging
        run: >-
          dotnet test
          --project tests/BrokerTests/BrokerTests.csproj
          --no-restore

  topology:
    name: Topology lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: archive/proof-sample/global.json

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Test Aspire topology
        run: >-
          dotnet test
          --project tests/TopologyTests/TopologyTests.csproj
          --no-restore
