pre-commit:
  jobs:
    - name: csharpier
      glob: "*.{cs,csx,config,csproj,props,targets,slnx,xml}"
      run: dotnet csharpier check . --include-generated
    - name: dotnet-style
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet format style archive/proof-sample/ModulithFoundry.slnx --verify-no-changes --no-restore
    - name: active-dotnet-style
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet format style ModulithFoundry.slnx --verify-no-changes --no-restore
    - name: dotnet-analyzers
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet format analyzers archive/proof-sample/ModulithFoundry.slnx --verify-no-changes --no-restore
    - name: active-dotnet-analyzers
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet format analyzers ModulithFoundry.slnx --verify-no-changes --no-restore
    - name: actor-identity-tests
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet test --project tests/ActorIdentityTests/ActorIdentityTests.csproj --no-restore
    - name: actor-http-tests
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet test --project tests/ActorIdentityAspNetCoreTests/ActorIdentityAspNetCoreTests.csproj --no-restore
    - name: http-identity-composition-tests
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet test --project samples/Wholesale/HttpIdentityDemo.Tests/HttpIdentityDemo.Tests.csproj --no-restore
    - name: tenancy-tests
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet test --project tests/TenantTests/TenantTests.csproj --no-restore
    - name: context-composition-tests
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet test --project samples/Wholesale/ContextDemo.Tests/ContextDemo.Tests.csproj --no-restore
    - name: ef-model-tests
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet test --project tests/EntityFrameworkCoreTests/EntityFrameworkCoreTests.csproj --no-restore
    - name: active-architecture-tests
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet test --project tests/ArchitectureTests/ArchitectureTests.csproj --no-restore
    - name: architecture-tests
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet test --project archive/proof-sample/tests/ArchitectureTests/ArchitectureTests.csproj --no-restore

commit-msg:
  jobs:
    - name: commitlint
      run: >-
        npm exec --prefix tools/repository -- commitlint
        --config tools/repository/commitlint.config.mjs
        --edit {1}
