name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node.js for repository checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install repository tools
        run: npm ci --prefix tools/repository

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Restore repository tools
        run: dotnet tool restore

      - name: Verify formatting
        run: dotnet csharpier check . --include-generated

      - name: Verify code style
        run: dotnet format style ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Verify analyzers
        run: dotnet format analyzers ModulithFoundry.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ModulithFoundry.slnx --no-restore

      - name: Test application behavior
        run: >-
          dotnet test
          --project tests/ApplicationTests/ApplicationTests.csproj
          --no-build
          --no-restore

      - name: Test architecture
        run: >-
          dotnet test
          --project tests/ArchitectureTests/ArchitectureTests.csproj
          --no-build
          --no-restore

      - name: Check pull-request commits
        if: github.event_name == 'pull_request'
        run: >-
          npm exec --prefix tools/repository -- commitlint
          --config tools/repository/commitlint.config.mjs
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Check pushed commit
        if: github.event_name == 'push'
        run: >-
          npm exec --prefix tools/repository -- commitlint
          --config tools/repository/commitlint.config.mjs
          --last
          --verbose

  postgresql:
    name: PostgreSQL lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Test PostgreSQL behavior
        run: >-
          dotnet test
          --project tests/PersistenceTests/PersistenceTests.csproj
          --no-restore

  broker:
    name: RabbitMQ lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Test durable messaging
        run: >-
          dotnet test
          --project tests/BrokerTests/BrokerTests.csproj
          --no-restore

  topology:
    name: Topology lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ModulithFoundry.slnx

      - name: Test Aspire topology
        run: >-
          dotnet test
          --project tests/TopologyTests/TopologyTests.csproj
          --no-restore
